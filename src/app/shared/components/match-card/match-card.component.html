<swiper-container
  #swiperEl
  loop="false"
  class="match-swiper"
  space-between="30"
  slides-per-view="auto"
  initial-slide="10"
>
  <swiper-slide *ngFor="let match of matches">
    <div class="match-card">
      <div class="match-card__header">
        <h4>Сезон {{match.season}}, {{match.round}}-й тур</h4>
        <h3>{{match.date}}</h3>
      </div>
      <div class="match-card__teams">
        <div class="match-card__team">
          <img src="{{match.team1_img}}" alt="Логотип футбольной команды">
          <p>{{match.team1}}</p>
        </div>
        <span>{{match.team1_goal}} : {{match.team2_goal}}</span>
        <div class="match-card__team">
          <img src="{{match.team2_img}}" alt="Логотип футбольной команды">
          <p>{{match.team2}}</p>
        </div>
      </div>
      <p>{{match.location}}</p>
    </div>
  </swiper-slide>
</swiper-container>
